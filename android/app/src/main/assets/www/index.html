<style>
#x3-2008{--bg:#0c0d0e;--surface:#191a1c;--surface-high:#27282a;--border:var(--tone-42403a);--amber:var(--tone-ffb64b);--hot:var(--tone-ffdfa4);--mid:var(--tone-cfad77);--dim:var(--tone-aa916b);--off:var(--tone-3a3023);--brightness:1;width:100%;color:var(--hot);font:14px/1.35 'Trebuchet MS','Segoe UI',Arial,sans-serif;background:transparent;color-scheme:dark}
#x3-2008 *{box-sizing:border-box}#x3-2008 [hidden]{display:none!important}#x3-2008 button,#x3-2008 input,#x3-2008 select{font:inherit}#x3-2008 button{cursor:var(--cursor-interaction,pointer);touch-action:manipulation}#x3-2008 button:focus-visible,#x3-2008 input:focus-visible,#x3-2008 select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}#x3-2008 button:disabled{opacity:.35;cursor:default}
#x3-2008 .mx-housing{position:relative;display:grid;grid-template-columns:57px minmax(0,1fr);column-gap:7px;padding:11px 11px 22px 8px;background:linear-gradient(135deg,#313236,#141517 23%,#18191b 80%,#36373b);border:2px solid #414247;border-radius:8px;box-shadow:inset 0 1px #606165,inset 0 0 0 5px #17181b,0 5px 12px #0003}
#x3-2008 .mx-bezel{display:flex;flex-direction:column;align-items:center;gap:10px;background:linear-gradient(90deg,#25262a,#1b1c1f);padding:3px 0 5px;border-radius:3px;min-width:0}
#x3-2008 .mx-bezel small{font:8px/1 Arial,sans-serif;color:#c3c3c4;letter-spacing:.3px}#x3-2008 .mx-mic{display:flex;align-items:center;flex-direction:column;gap:5px;margin-bottom:9px}#x3-2008 .mx-mic>span{height:7px;width:7px;background:#030405;border:1px solid #4a4a4c;border-radius:50%}
#x3-2008 .mx-knob{position:relative;flex-shrink:0;width:52px;height:52px;min-height:52px;border:3px solid #0a0a0b;border-radius:50%;background:repeating-conic-gradient(#626365 0deg 3deg,#222326 3deg 6deg);box-shadow:0 0 0 1px #646469,inset 0 0 0 2px #313236;padding:0}
#x3-2008 .mx-knob>span{display:block;position:absolute;inset:3px;border-radius:50%;background:conic-gradient(from 12deg,#18191c,#5a5b5e 35deg,#222326 100deg,#151619 150deg,#55565a 215deg,#242529 290deg,#18191c);border:1px solid #6e6e72;box-shadow:inset 0 0 8px #151517}
#x3-2008 .mx-home-key{display:flex;align-items:center;flex-direction:column;gap:6px;margin-top:10px}#x3-2008 .mx-home-key button{width:31px;height:39px;background:linear-gradient(#494a4e,#25262a 47%,#1d1e21 52%,#323338);border:1px solid #77777b;border-bottom:2px solid #08090a;border-radius:2px;color:var(--hot);padding:5px;filter:brightness(var(--brightness))}#x3-2008 .mx-home-key svg{width:19px!important;height:19px!important}#x3-2008 .mx-home-key button:active{background:#18191b}#x3-2008 .mx-reset{display:flex;align-items:center;flex-direction:column;gap:5px;margin-top:8px}#x3-2008 .mx-reset>span{width:6px;height:6px;background:#020303;border-radius:50%;border:1px solid #48494c}
#x3-2008 .mx-usbc{width:10px;height:29px;background:#060707;border:2px solid #737478;border-radius:7px;margin-top:1px;box-shadow:inset 0 0 0 1px #0b0c0d}#x3-2008 .mx-charge{font-size:12px;color:#a2a2a4;line-height:1;margin-top:-7px}#x3-2008 .mx-usba{width:18px;height:43px;border:2px solid #76777b;border-radius:2px;background:#030405;position:relative;margin-top:-3px}#x3-2008 .mx-usba>span{position:absolute;top:5px;bottom:5px;left:2px;width:4px;background:repeating-linear-gradient(0deg,#17181b 0 5px,var(--tone-c0c0ba) 5px 7px)}#x3-2008 .mx-usba+small{margin-top:-5px}#x3-2008 .mx-aux{width:16px;height:16px;border-radius:50%;background:#030404;border:2px solid #75767a;box-shadow:0 0 0 2px #101113;margin-top:auto}#x3-2008 .mx-aux+small{margin-top:-4px}
#x3-2008 .ax-lcd{position:relative;min-width:0;background:var(--bg);border:3px solid #040506;box-shadow:0 0 0 1px #3b3c40,inset 0 0 12px #000;border-radius:3px;overflow:hidden;filter:brightness(var(--brightness));transition:filter .4s;display:flex;flex-direction:column;min-height:404px}#x3-2008 .mx-logo{position:absolute;left:57%;bottom:3px;transform:translateX(-50%);font:italic 12px/1 Arial,sans-serif;color:#a0a1a3;letter-spacing:1px;text-shadow:1px 1px #070808}

<style>
#x3-2008 .mx-player-pane{justify-content:space-evenly;gap:7px;padding-top:12px;padding-bottom:12px}
#x3-2008 .mx-player-upper{gap:10px}
#x3-2008 .mx-animation-caption{margin:4px 0 0;display:grid;grid-template-columns:44px minmax(0,1fr) 44px 108px;gap:6px}
#x3-2008 .mx-animation-caption button{min-height:44px;padding:4px 6px;font-size:12px}
#x3-2008 .mx-animation-caption button[data-action="clip-step"]{font-size:23px;border:1px solid var(--tone-57462c);border-radius:2px;background:var(--tone-211e18)}
#x3-2008 .mx-animation-caption button:hover{color:var(--hot);background:var(--tone-392c1b)}
#x3-2008 .mx-radio-pane{padding-top:4px;padding-bottom:4px}
#x3-2008 .mx-player-pane .mx-progress-block{margin-top:0}
#x3-2008 .mx-player-pane .mx-transport{margin-top:3px}
#x3-2008 .mx-movie-shuffle{font-size:12px!important;min-height:44px!important;gap:5px;border:1px solid var(--tone-665132);background:var(--tone-29251d)}
#x3-2008 .mx-movie-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
#x3-2008 .mx-movie-choice{min-height:48px;padding:9px 6px;font-size:13px;justify-content:flex-start;text-align:left}
#x3-2008 .mx-movie-choice svg{flex-shrink:0;width:15px!important;height:15px!important}
#x3-2008 .mx-movie-choice span{overflow-wrap:anywhere}
@media(max-width:750px){#x3-2008 .mx-movie-list{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:480px){#x3-2008 .mx-movie-list{grid-template-columns:repeat(2,minmax(0,1fr))}#x3-2008 .mx-animation-caption{grid-template-columns:36px minmax(0,1fr) 36px 42px}#x3-2008 .mx-shuffle-label{display:none}#x3-2008 .mx-animation-caption button[data-action="clip-step"]{font-size:20px}}
#x3-2008 .mx-gallery-pane{padding-top:10px;padding-bottom:8px}
#x3-2008 .mx-gallery-pane .ax-heading{margin-bottom:9px;padding-bottom:7px;font-size:18px}
#x3-2008 .mx-animation-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-bottom:10px}
#x3-2008 .mx-animation-tabs button{min-height:38px;padding:7px 3px;font-size:12px}
#x3-2008 .mx-animation-choice{padding:7px;gap:5px;min-height:0;font-size:12px}
#x3-2008 .mx-animation-choice img{height:62px;aspect-ratio:auto;border:0}
#x3-2008 .mx-animation-choice span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#x3-2008 .mx-gallery-pagination{display:grid;grid-template-columns:120px 1fr 120px;align-items:center;text-align:center;gap:8px;margin-top:8px}
#x3-2008 .mx-gallery-pagination button{min-height:36px;padding:7px;font-size:12px}
#x3-2008 .mx-gallery-footer{margin-top:8px}
#x3-2008 .mx-gallery-footer button{min-height:37px;padding:7px 12px;font-size:12px}
#x3-2008 .mx-selected-clip{color:var(--amber);font-size:12px;text-align:center}
#x3-2008 .mx-gallery-note{margin:8px 0 0;color:var(--dim);font-size:11px;line-height:1.35}
#x3-2008 .mx-lab-pane{padding-top:8px;padding-bottom:8px}
#x3-2008 .mx-lab-tabs{display:flex;gap:6px;margin-bottom:10px}
#x3-2008 .mx-lab-tabs button{flex:1;min-height:36px;padding:7px}
#x3-2008 .mx-lab-table{width:100%;border-collapse:collapse;font-size:12px;color:var(--mid)}
#x3-2008 .mx-lab-table td,#x3-2008 .mx-lab-table th{padding:7px 5px;border-bottom:1px solid var(--tone-3d3529);text-align:left;font-weight:400}
#x3-2008 .mx-lab-table td:last-child{color:var(--hot);text-align:right;font-variant-numeric:tabular-nums}
#x3-2008 .mx-lab-note{font-size:12px;line-height:1.5;color:var(--mid);margin:9px 0}
#x3-2008 .mx-budget-track{height:20px;background:var(--tone-332c23);margin:9px 0;overflow:hidden}
#x3-2008 .mx-budget-fill{display:block;height:100%;background:var(--tone-bc7f32);max-width:100%}
#x3-2008 .mx-memory-result{color:var(--amber);font-size:16px;font-variant-numeric:tabular-nums}
@media(max-width:600px){#x3-2008 .mx-animation-choice img{height:55px}#x3-2008 .mx-animation-tabs{grid-template-columns:repeat(3,minmax(0,1fr))}#x3-2008 .mx-selected-clip{order:3;width:100%}}
@media(max-width:400px){#x3-2008 .mx-gallery-pagination{grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr)}#x3-2008 .mx-animation-tabs button{font-size:11px}#x3-2008 .mx-animation-caption button{font-size:11px}#x3-2008 .mx-lab-table{font-size:11px}#x3-2008 .mx-lab-note{font-size:11px}}
</style>

#x3-2008 .mx-animation::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.5;background:repeating-linear-gradient(#0000 0 1.5px,#0007 1.5px 3px)}

#x3-2008 .mx-animation{border:0!important;box-shadow:none!important;isolation:isolate}

#x3-2008 .mx-animation .mx-animation-hit{position:absolute;top:0;bottom:0;width:50%;z-index:3;background:transparent;border:0;border-radius:0;box-shadow:none;padding:0;min-height:44px;color:transparent}
#x3-2008 .mx-animation .mx-animation-hit:hover,#x3-2008 .mx-animation .mx-animation-hit:active{background:transparent;border:0;box-shadow:none}
#x3-2008 .mx-animation .mx-animation-hit:focus-visible{outline:2px solid var(--amber);outline-offset:-3px}
#x3-2008 .mx-animation-left{left:0}

#x3-2008 .mx-animation-caption{grid-template-columns:minmax(0,1fr) 108px!important}
#x3-2008 .mx-animation-caption button:first-child{text-align:left;justify-content:flex-start;padding-left:0}

@media(max-width:480px){#x3-2008 .mx-animation-caption{grid-template-columns:minmax(0,1fr) 44px!important}#x3-2008 .mx-track-details .mx-track-title{font-size:21px}#x3-2008 .mx-track-artist,#x3-2008 .mx-track-index{font-size:12px}}

<style>/* Y2K player details; button surfaces and the navigation arc live in transport-keys.css. */
#x3-2008 .ax-heading{border-bottom-color:var(--off);gap:8px}
#x3-2008 .ax-heading::before{content:'';display:block;width:20px;height:11px;flex-shrink:0;background:repeating-linear-gradient(115deg,var(--amber) 0 2px,transparent 2px 6px);opacity:.7}
#x3-2008 .ax-heading>span:first-child{margin-right:auto}
#x3-2008 .mx-source-button{font-size:18px}
#x3-2008 .ax-menu-row>span:first-child::before{content:'·';color:var(--amber);margin-right:8px}
#x3-2008 .ax-eq-bank{background:repeating-linear-gradient(0deg,transparent 0 29px,#8799a122 29px 30px)}
#x3-2008 .ax-eq-band{border-left:1px solid var(--off);border-right:1px solid #050a0d;background:linear-gradient(90deg,#05090b,#11191b 45%,#030607)}
#x3-2008 .ax-eq-band.active{background:linear-gradient(90deg,#0a1115,var(--off),#050a0c);border-color:var(--mid);border-radius:2px}
#x3-2008 .ax-select{border-color:var(--dim);background:linear-gradient(var(--off),#060c10);box-shadow:inset 0 1px 3px #000;color:var(--hot)}
#x3-2008 .mx-animation-caption button[data-action="entertainment"]::before{content:'';display:inline-block;width:11px;height:11px;margin-right:6px;border:1px solid var(--mid);border-radius:50%;background:radial-gradient(var(--amber) 0 2px,#000 3px 4px,transparent 5px)}
#x3-2008 .mx-animation .mx-animation-hit{background:transparent!important;border:0!important;box-shadow:none!important;border-radius:0!important}
#x3-2008 .ax-eq-readout{padding-top:9px}
@media(max-width:600px){#x3-2008 .mx-source-button{font-size:16px}}

<style>/* Static vector chrome keeps the material detailed without animated shader work. */

#x3-2008 .mx-top-left,#x3-2008 .mx-top-right{position:relative;z-index:1;text-shadow:0 1px 2px #000,1px 0 #000}

<style>/* Theme-tinted media-player keys and a fixed, finger-friendly control area. */
html{height:100%;overflow:hidden}
body{box-sizing:border-box;width:100%;height:100dvh;max-width:1052px;margin:0 auto;padding:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#x3-2008{--nav-size:clamp(56px,6.2cqw,64px);--nav-rise:clamp(12px,1.8cqw,20px);--key-width:clamp(48px,5.8cqw,64px);--key-height:clamp(44px,4.8cqw,52px);--library-width:clamp(58px,7cqw,76px);flex-shrink:0}
#x3-2008 .mx-core-mark{display:none!important}
#x3-2008 .ax-lcd{height:min(calc((100cqw - 87px)*.5859375),calc(100dvh - 49px));min-height:0;aspect-ratio:auto}
#x3-2008 #ax-main{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--off) #000}
#x3-2008[data-player-layout="media"] #ax-main{overflow:hidden}
#x3-2008 .ax-lcd button:not(.mx-animation-hit){background:linear-gradient(135deg,#ffffff12,transparent 32%,#0005 85%),linear-gradient(to bottom,var(--dim) 0,var(--off) 9%,#030708 54%,var(--off) 94%,#000 100%);color:var(--mid);border:1px solid var(--dim);border-radius:2px;box-shadow:inset 1px 1px 1px #ffffff2b,inset -2px -2px 2px #000a;min-height:44px}
#x3-2008 .ax-lcd button:not(.mx-animation-hit):hover{color:var(--hot);filter:brightness(1.1)}
#x3-2008 .ax-lcd button[aria-pressed="true"],#x3-2008 .ax-lcd button.selected{color:var(--amber);background:linear-gradient(var(--off),#000 60%,var(--off));box-shadow:inset 1px 2px 3px #000b,inset -1px -1px #ffffff19;border-color:var(--amber)}
#x3-2008 .ax-lcd button:not(.mx-animation-hit):active{box-shadow:inset 2px 3px 4px #000;transform:translateY(1px)}
#x3-2008 .ax-button::after{display:none!important}
#x3-2008 .mx-topbar{padding:0 7px;min-height:44px;height:44px}
#x3-2008 .mx-topbar button,#x3-2008 .mx-topbar button:hover,#x3-2008 .mx-topbar button:active{min-width:44px;min-height:44px;background:transparent!important;border:0!important;box-shadow:none!important;transform:none}
#x3-2008 .mx-top-left,#x3-2008 .mx-top-right{gap:4px}
#x3-2008 .mx-source-button .mx-skin-icon{background:none;border:0;box-shadow:none;border-radius:0;padding:0}
/* Metadata, the flexible display and elapsed time stay above the fixed controls. */
#x3-2008 .mx-player-pane{display:grid;grid-template-rows:minmax(0,1fr) 16px;height:100%;min-height:0;flex:1;gap:3px;padding:5px 12px 3px}
#x3-2008 .mx-player-pane>*{flex-shrink:1;min-height:0}
#x3-2008 .mx-player-pane .mx-player-upper{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:42px minmax(0,1fr);height:100%;min-height:0;gap:3px;margin:0;align-items:stretch}
#x3-2008 .mx-player-art{display:flex;min-height:0;height:100%;width:100%}
#x3-2008 .mx-player-art .mx-animation{flex:1;min-height:0;height:100%;aspect-ratio:auto}
#x3-2008 .mx-track-details{min-height:0;grid-template-rows:26px 14px;gap:1px 8px}
#x3-2008 .mx-track-details .mx-track-title{font-size:clamp(18px,2.5cqw,24px);line-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#x3-2008 .mx-track-details .mx-track-artist{font-size:11px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#x3-2008 .mx-track-index{font-size:10px!important;line-height:14px;padding-top:4px}
#x3-2008 .mx-player-pane .mx-progress-block{margin:0}
#x3-2008 .ax-time-row{font-size:11px;line-height:16px}
/* Six transport keys and three direct library selectors share one row. */
#x3-2008 .mx-bottom-dock{position:relative;flex-shrink:0;display:grid;grid-template-rows:calc(var(--key-height) + 6px) calc(var(--nav-size) + var(--nav-rise));gap:2px;height:calc(var(--key-height) + var(--nav-size) + var(--nav-rise) + 16px);min-height:0;padding:4px 12px 6px;background:#000}
#x3-2008 .mx-dock-row{display:flex;align-items:center;justify-content:center;gap:12px;min-width:0}
#x3-2008 #mx-playback-dock{min-width:0}
#x3-2008[data-player-layout="other"] #mx-playback-dock{display:none}
#x3-2008 .mx-classic-transport{display:grid;grid-template-columns:repeat(6,var(--key-width));align-self:center;width:max-content;gap:3px!important;padding:2px;background:#000;border:1px solid var(--off);border-radius:1px;margin:0!important}
#x3-2008 .ax-lcd .mx-classic-transport .mx-classic-key{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;width:var(--key-width);height:var(--key-height);min-height:var(--key-height);padding:4px!important;gap:0;border:1px solid var(--dim);border-radius:1px;background:linear-gradient(135deg,#ffffff24,transparent 28%,#0008 78%),linear-gradient(to bottom,var(--mid) 0%,var(--dim) 5%,var(--off) 13%,#030708 53%,var(--off) 88%,#000 100%);box-shadow:inset 2px 2px 1px #ffffff36,inset -3px -3px 2px #000c,0 1px 1px #000;color:var(--mid)}
#x3-2008 .ax-lcd .mx-classic-transport .mx-classic-key::before{content:'';position:absolute;inset:4px;border:1px solid #ffffff0c;pointer-events:none}
#x3-2008 .ax-lcd .mx-classic-transport .mx-classic-key[aria-pressed="true"]{color:var(--amber);background:linear-gradient(135deg,#ffffff19,transparent 35%,#0008 80%),linear-gradient(to bottom,var(--dim),var(--off) 12%,#000 48%,var(--off) 92%,var(--mid));box-shadow:inset 2px 3px 3px #000b,inset -1px -1px 1px #ffffff24,0 1px #000}
#x3-2008 .mx-classic-transport .mx-transport-glyph,#x3-2008 .mx-classic-key .mx-skin-icon{width:28px!important;height:28px!important;fill:currentColor;stroke:#0008;stroke-width:.7;stroke-linejoin:miter;filter:drop-shadow(1px 1px 0 #000) drop-shadow(-1px -1px 0 #ffffff28)}
#x3-2008 .mx-classic-transport .mx-classic-key[aria-pressed="true"] .mx-transport-glyph{filter:drop-shadow(1px 1px 0 #000);transform:translateY(1px)}
#x3-2008 .mx-animation-tools{position:static;display:grid;grid-template-columns:repeat(3,var(--library-width));gap:4px;flex-shrink:0}
#x3-2008 .ax-lcd .mx-animation-tools button{width:var(--library-width);height:var(--key-height);min-height:var(--key-height);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px;font-size:10px;line-height:1.2}
#x3-2008 .mx-animation-tools svg{width:17px!important;height:17px!important}
